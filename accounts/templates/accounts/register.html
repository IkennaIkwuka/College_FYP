{% extends "accounts/base.html" %}

{% block title %}Add Student - UniPortal{% endblock %}

{% block content %}
    <h1>Add Student</h1>
    <p class="text-muted">The student's initial password will be their own matric number. They'll be required to change it on first login.</p>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Add Student</button>
            </form>
        </div>
    </div>
{% endblock %}
