{% extends "accounts/base.html" %}

{% block title %}Add Student - UniPortal{% endblock %}

{% block content %}
    <h1>Add Student</h1>
    <p>The student's initial password will be their own matric number. They'll be required to change it on first login.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Student</button>
    </form>
{% endblock %}
