{% extends "accounts/base.html" %}

{% block title %}Change Password - UniPortal{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm mt-4">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3 text-center">Change Password</h1>
                    {% if user.must_change_password %}
                        <p class="alert alert-warning">You must set a new password before continuing.</p>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-2">Change Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
