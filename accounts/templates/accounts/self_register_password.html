{% extends "accounts/base.html" %}

{% block title %}Set Your Password - LU-SIMS{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm mt-4">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3 text-center">Set Your Password</h1>
                    <p class="text-muted text-center small">
                        Your username will be generated automatically and shown to you
                        once your account is created.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-2">Complete Registration</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
