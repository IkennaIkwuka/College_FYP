{% extends "accounts/base.html" %}

{% block title %}Log in - LU-SIMS{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm mt-4">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3 text-center">Log in</h1>
                    <p class="text-muted text-center small">
                        First time logging in? Your password is <strong>{{ default_password }}</strong>.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
