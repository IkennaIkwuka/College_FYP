{% extends "accounts/base.html" %}

{% block title %}Check Your Email - LU-SIMS{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm mt-4">
                <div class="card-body p-4 text-center">
                    <h1 class="h3 mb-3">Check Your Email</h1>
                    <p class="text-muted">
                        If an account exists with that email, we've sent a link to reset your password.
                        The link expires in 1 hour.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-primary mt-2">Back to log in</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
